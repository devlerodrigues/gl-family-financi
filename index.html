<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GL Family — Registrar gasto</title>
<style>
:root{--bg:#0b1738;--card:#152858;--gold:#fbbf24;--muted:#c5d2ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:16px system-ui,Arial,sans-serif}
header{padding:20px 22px;background:#1e3a8a;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;margin:0}header small{color:var(--muted)}main{max-width:540px;margin:24px auto;padding:0 16px}.card{background:var(--card);padding:25px;border:1px solid #39548d;border-radius:18px}
h2{color:var(--gold);margin:0 0 10px;font-size:24px}p{color:var(--muted);line-height:1.5}
label{display:block;margin-top:18px;color:#e4e9f4;font-size:14px}input,select{display:block;width:100%;margin-top:7px;border:1px solid #4b679c;border-radius:10px;padding:14px;color:white;background:#091632;font:16px system-ui}
button{border:0;border-radius:10px;padding:14px 16px;cursor:pointer;background:var(--gold);color:#172451;font:700 16px system-ui;min-height:48px}
button:disabled{opacity:.55;cursor:default}.submit{width:100%;margin-top:24px}#logout{background:transparent;border:1px solid #8099ca;color:white;font-size:13px;padding:8px 12px;min-height:38px}
#app{display:none}#login{margin-top:8vh}#notice{min-height:30px;margin:15px 0;color:var(--gold)}.foot{font-size:12px;color:var(--muted)}
@media(max-width:560px){header{padding:15px}h1{font-size:19px}main{margin:15px auto}.card{padding:20px}}
</style></head><body>
<header><div><h1>GL Family</h1><small>Controle de gastos</small></div><button id="logout" hidden>Sair</button></header>
<main>
<section id="login" class="card"><h2>Entrar</h2><p>Acesse sua conta para registrar despesas.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="submit">Entrar</button></form></section>
<section id="app" class="card"><h2>Registrar gasto</h2><p>Informe o que você pagou. Cada registro é salvo com uma categoria.</p>
<form id="expenseForm">
<label>Descrição<input id="description" placeholder="Ex.: Supermercado BH" maxlength="250" required></label>
<label>Valor (R$)<input id="amount" type="number" min=".01" step=".01" inputmode="decimal" placeholder="0,00" required></label>
<label>Categoria<select id="category" required><option value="">Selecione a categoria</option><option>Supermercado</option><option>Alimentação</option><option>Moradia</option><option>Contas da casa</option><option>Transporte</option><option>Veículo</option><option>Saúde</option><option>Educação</option><option>Lazer</option><option>Assinaturas</option><option>Compras</option><option>Outros</option></select></label>
<label>Conta utilizada<select id="account" required></select></label>
<label>Data do pagamento<input id="date" type="date" required></label>
<button class="submit" id="save">Salvar gasto</button>
</form><p class="foot">O registro será considerado pago. Nenhuma parcela será gerada automaticamente.</p></section>
<p id="notice" role="status" aria-live="polite"></p>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.58.0';
const db=createClient('https://touqchuigiibfnzaqqwo.supabase.co','sb_publishable_nhTL2Vq-ykAttPCR7lMJGw_vZHSZ2tz');
const el=id=>document.getElementById(id);
const notify=s=>el('notice').textContent=s;
function localToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
el('date').value=localToday();
async function showUser(user){
 el('login').style.display=user?'none':'block';el('app').style.display=user?'block':'none';el('logout').hidden=!user;
 if(!user)return;
 const {data,error}=await db.from('financial_accounts').select('id,name').order('created_at');
 if(error){notify('Não foi possível carregar suas contas: '+error.message);return}
 const select=el('account');select.replaceChildren();
 for(const a of data||[]){const option=document.createElement('option');option.value=a.id;option.textContent=a.name;select.append(option)}
 if(!data?.length){const option=document.createElement('option');option.textContent='Nenhuma conta cadastrada';option.value='';select.append(option);notify('Não há conta bancária cadastrada.');el('save').disabled=true}else{el('save').disabled=false}
}
el('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();notify('Entrando...');
 const button=e.target.querySelector('button');button.disabled=true;
 try{const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)notify(error.message);else {await showUser(data.user);notify('')}}catch(err){notify(err.message||'Falha no login')}finally{button.disabled=false}
});
el('logout').addEventListener('click',async()=>{const {error}=await db.auth.signOut();if(error)notify(error.message);else{await showUser(null);notify('')}});
el('expenseForm').addEventListener('submit',async e=>{
 e.preventDefault();const amount=Number(el('amount').value);
 if(!Number.isFinite(amount)||amount<=0||!el('account').value)return notify('Confira o valor e a conta escolhida.');
 const button=el('save');button.disabled=true;notify('Salvando...');
 try{const {error}=await db.from('transactions').insert({account_id:el('account').value,description:el('description').value.trim(),amount,category_label:el('category').value,kind:'expense',status:'paid',due_date:el('date').value,paid_at:new Date().toISOString()});if(error){notify('Não foi possível salvar: '+error.message);return}e.target.reset();el('date').value=localToday();notify('Gasto registrado com sucesso.')}catch(err){notify(err.message||'Falha ao salvar')}finally{button.disabled=false}
});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showUser(null)});
try{const {data,error}=await db.auth.getSession();if(error)notify(error.message);else await showUser(data.session?.user||null)}catch(err){notify('Não foi possível iniciar: '+(err.message||'erro'))}
</script></body></html>
